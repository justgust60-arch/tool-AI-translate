<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ឧបករណ៍បកប្រែ និងបញ្ចូលសំឡេងរឿងភាគចិន AI (Khmer AI Dubbing Tool)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    },
                    fontFamily: {
                        kantumruuy: ['Kantumruuy Pro', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Kantumruuy Pro', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-amber-400">រឿងភាគចិន AI Translator</h1>
            <span class="text-xs text-green-400 font-mono" id="backend-status-indicator">● Backend Connected</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">
        
        <!-- STEP 1: Upload Video -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <h2 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-file-video text-red-500"></i> ១. ជ្រើសរើសវីដេអូរឿងភាគចិន
            </h2>
            <div id="drop-zone" onclick="document.getElementById('video-file-input').click()" class="border-2 border-dashed border-slate-700 bg-slate-950/50 rounded-2xl p-8 text-center cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-amber-400 mb-2"></i>
                <p id="file-name-display" class="text-xs font-semibold text-slate-200">ចុចទីនេះដើម្បីជ្រើសរើសវីដេអូ</p>
                <input type="file" id="video-file-input" class="hidden" accept="video/*" onchange="handleFileSelect(event)">
            </div>
            
            <button onclick="splitVideoOnBackend()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition">
                <i class="fa-solid fa-scissors mr-1"></i> បំបែកវីដេអូកាត់ជាដុំៗ (Split Video)
            </button>
        </section>

        <!-- STEP 2: Generate Khmer Audio -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <h2 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-microphone-lines text-red-500"></i> ២. បង្កើត និងស្តាប់សំឡេង AI ខ្មែរ (Khmer Audio TTS)
            </h2>
            <div class="flex gap-4 items-center">
                <select id="voice-gender" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                    <option value="male">សំឡេងប្រុស (Piseth)</option>
                    <option value="female" selected>សំឡេងស្រី (Sreymom)</option>
                </select>
                <button onclick="generateKhmerAudioTTS()" class="flex-1 py-3 bg-gradient-to-r from-red-600 to-amber-600 text-white font-bold rounded-xl text-xs transition">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> បង្កើតសំឡេង AI ខ្មែរទាំងអស់ (Synthesize)
                </button>
            </div>

            <!-- Audio List Container -->
            <div id="tts-audio-list" class="space-y-3 pt-2">
                <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-center text-xs text-slate-500">
                    សូមចុចប៊ូតុង "បង្កើតសំឡេង AI ខ្មែរទាំងអស់" ដើម្បីស្ដាប់សំឡេង
                </div>
            </div>
        </section>
    </main>

    <script>
        // អាន URL ពី Netlify Environment Variable ដោយស្វ័យប្រវត្តិ
        // ប្រសិនបើគ្មាន វាប្រើប្រាស់ URL ជាក់លាក់ដែលអ្នកកំពុងប្រើប្រាស់
        const BACKEND_URL = (typeof import.meta !== 'undefined' && import.meta.env && import.meta.env.VITE_BACKEND_URL) 
            ? import.meta.env.VITE_BACKEND_URL 
            : window.location.origin;

        let selectedFile = null;
        const subtitlesData = [
            { id: 1, time: "00:00:06 - 00:00:10", khmer: "ទីនេះគឺជាកន្លែងសម្ងាត់ដែលយើងបានស្វែងរកជាច្រើនឆ្នាំមកហើយ។" },
            { id: 2, time: "00:00:11 - 00:00:15", khmer: "បច្ចេកវិទ្យា AI កំពុងផ្លាស់ប្ដូរជីវិតរបស់យើងនៅពេលបច្ចុប្បន្ន។" },
            { id: 3, time: "00:00:16 - 00:00:20", khmer: "សូមស្វាគមន៍អ្នកទាំងអស់គ្នាចូលរួមប្រើប្រាស់ប្រព័ន្ធបកប្រែនេះ។" }
        ];

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-name-display').innerText = `បានជ្រើសរើស៖ ${file.name} (${(file.size/(1024*1024)).toFixed(2)} MB)`;
            }
        }

        async function splitVideoOnBackend() {
            if (!selectedFile) {
                alert('សូមជ្រើសរើសឯកសារវីដេអូជាមុនសិន!');
                return;
            }

            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("chunk_duration_min", 15);

            try {
                alert("កំពុងផ្ញើវីដេអូទៅកាន់ Python Backend... សូមរង់ចាំបន្តិច!");
                const response = await fetch(`${BACKEND_URL}/api/split-video`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if(response.ok) {
                    alert(`ជោគជ័យ! វីដេអូត្រូវបានកាត់ជា ${data.total_chunks} ចំណែក។`);
                } else {
                    alert('កំហុស៖ ' + (data.detail || 'មិនអាចកាត់វីដេអូបានទេ'));
                }
            } catch(err) {
                alert('កំហុសភ្ជាប់ទៅកាន់ Backend: ' + err.message + '\nសូមពិនិត្យមើលថា Link Ngrok លើ Colab កំពុងដំណើរការដែរឬទេ!');
            }
        }

        async function generateKhmerAudioTTS() {
            const gender = document.getElementById('voice-gender').value;
            const listContainer = document.getElementById('tts-audio-list');
            listContainer.innerHTML = `<div class="p-4 bg-slate-950 rounded-xl text-center text-xs text-amber-400 animate-pulse">កំពុងបង្កើតសំឡេង AI ខ្មែរតាម Edge-TTS...</div>`;

            let htmlContent = '';
            for (let i = 0; i < subtitlesData.length; i++) {
                const item = subtitlesData[i];
                const formData = new FormData();
                formData.append('text', item.khmer);
                formData.append('gender', gender);

                try {
                    const response = await fetch(`${BACKEND_URL}/api/generate-khmer-audio`, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const blob = await response.blob();
                        const audioUrl = URL.createObjectURL(blob);
                        htmlContent += `
                            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between gap-3">
                                <div class="overflow-hidden">
                                    <p class="text-[10px] font-mono text-amber-400">${item.time}</p>
                                    <p class="text-xs text-slate-200 truncate">${item.khmer}</p>
                                </div>
                                <audio controls src="${audioUrl}" class="h-8 max-w-[180px]"></audio>
                            </div>
                        `;
                    } else {
                        htmlContent += `<div class="p-3 bg-red-950/40 text-red-400 text-xs rounded-xl">កំហុសក្នុងការបង្កើតសំឡេងទី ${i+1}</div>`;
                    }
                } catch (err) {
                    htmlContent += `<div class="p-3 bg-red-950/40 text-red-400 text-xs rounded-xl">មិនអាចតភ្ជាប់ទៅ Backend ទេ។</div>`;
                }
            }
            listContainer.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
